services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
  orders-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: orders, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
    ports: ["5433:5432"]
    volumes: [orders-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app -d orders"], interval: 5s, timeout: 3s, retries: 10}
  inventory-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: inventory, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
    ports: ["5434:5432"]
    volumes: [inventory-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app -d inventory"], interval: 5s, timeout: 3s, retries: 10}
  payments-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: payments, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
    ports: ["5435:5432"]
    volumes: [payments-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app -d payments"], interval: 5s, timeout: 3s, retries: 10}
  order-service:
    build: {context: ., dockerfile: order-service/Dockerfile}
    ports: ["8081:8081"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/orders, SPRING_DATASOURCE_USERNAME: app, SPRING_DATASOURCE_PASSWORD: app, SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092}
    depends_on: {orders-db: {condition: service_healthy}, kafka: {condition: service_healthy}}
  inventory-service:
    build: {context: ., dockerfile: inventory-service/Dockerfile}
    ports: ["8082:8082"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory, SPRING_DATASOURCE_USERNAME: app, SPRING_DATASOURCE_PASSWORD: app, SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092}
    depends_on: {inventory-db: {condition: service_healthy}, kafka: {condition: service_healthy}}
  payment-service:
    build: {context: ., dockerfile: payment-service/Dockerfile}
    ports: ["8083:8083"]
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://payments-db:5432/payments, SPRING_DATASOURCE_USERNAME: app, SPRING_DATASOURCE_PASSWORD: app, SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092}
    depends_on: {payments-db: {condition: service_healthy}, kafka: {condition: service_healthy}}
volumes: {orders-data: {}, inventory-data: {}, payments-data: {}}
